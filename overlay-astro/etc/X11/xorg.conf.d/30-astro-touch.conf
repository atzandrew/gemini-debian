# Astro: the X greeter rotates the screen with xrandr (right) but X does
# not rotate touch: libinput calibration (3x3) = 90 degrees clockwise, for
# the GT9897 with touchscreen-inverted-x in the DT (touch = panel frame).
# Wayland (KWin) applies the panel orientation itself and ignores this.
Section "InputClass"
	Identifier  "astro-touch"
	MatchProduct "Goodix Berlin"
	MatchIsTouchscreen "on"
	Option      "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
