# Astro: X on the panel through mediatek-drm (modesetting), not fbdev and
# not the render-only GPU.
Section "Device"
	Identifier "astro-panel"
	Driver     "modesetting"
	Option     "kmsdev" "/dev/dri/astro-panel"
	# Command-mode panel: software rendering + shadow, flushed with
	# DIRTYFB on every damage (with glamor the greeter's drawing did not
	# reach the panel: "Failed to make import prime FD as pixmap").
	Option     "AccelMethod" "none"
	Option     "ShadowFB" "on"
EndSection

Section "Screen"
	Identifier "astro-screen"
	Device     "astro-panel"
EndSection

Section "ServerLayout"
	Identifier "astro"
	Screen     "astro-screen"
	Option     "AutoAddGPU" "off"
EndSection
