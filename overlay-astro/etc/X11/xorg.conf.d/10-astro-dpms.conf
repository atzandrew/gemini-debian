# Astro OLED (burn-in rule): the SDDM greeter has no idle screen-off of
# its own. Blank and DPMS off after 1 minute (DPMS off = mediatek-drm CRTC
# off = the SH8802B stock off sequence); a key wakes it.
Section "ServerFlags"
	Option "BlankTime"   "1"
	Option "StandbyTime" "1"
	Option "SuspendTime" "1"
	Option "OffTime"     "1"
EndSection
