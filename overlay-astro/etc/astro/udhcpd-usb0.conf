# USB link (g_ether on the right-hand port): hand the connected computer
# 10.15.21.2 so its NetworkManager stops retrying DHCP (and showing
# "disconnected" every 45 s). No router and no DNS option: SSH to
# 10.15.21.1 only; no internet is passed either way. Same lease as the
# rescue initramfs (astro-linux618 initramfs/init).
start 10.15.21.2
end 10.15.21.2
interface usb0
max_leases 1
lease_file /run/astro-udhcpd-usb0.leases
option subnet 255.255.255.0
