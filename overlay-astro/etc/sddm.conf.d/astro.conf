# Astro Slide: SDDM on Wayland with KWin as the login screen's compositor
# (as the Cosmo, devices/cosmo). KWin renders on panfrost and drives the
# panel through mediatek-drm, as the Plasma session does; it takes the
# rotation from the panel's orientation property and the output config in
# /var/lib/sddm/.config/kwinoutputconfig.json, and maps touch itself.
# SDDM has no idle screen-off: KWin starts astro-greeter-idle, which turns
# the panel off after 60 s without input (OLED burn-in rule).
# (The X11 greeter was software-rendered and very slow; its files under
# /etc/X11/xorg.conf.d and /etc/sddm/astro-Xsetup stay for a later retry
# and are not used here.)
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
InputMethod=

[Wayland]
# Same GL settings as the Plasma session (/etc/xdg/plasma-workspace/env/astro.sh).
CompositorCommand=env KWIN_COMPOSE=O2ES PAN_MESA_DEBUG=noafbc kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 /usr/libexec/astro-greeter-idle

[Theme]
Current=breeze
