# Astro gen4m Wi-Fi creates wlan0 plus wlan1 (second STA), ap0 (SoftAP) and
# p2p0. NM would try a saved profile on any of them (it picked ap0 and failed
# with "association took too long", 2026-11-25); only wlan0 is for NM.
[keyfile]
unmanaged-devices=interface-name:ap0;interface-name:wlan1;interface-name:p2p0
