# Astro Slide speaker filter (default). Measured EQ on top of the stock
# Android speaker filter (astro-linux618 docs/audio-stock.md "Speaker EQ"):
# - 300 Hz 2nd-order high-pass: the stock speaker compensation filter
#   (vendor PlaybackACF "Speaker", bes_loudness_L_hpf_fc 0x12C, order 2);
# - +3 dB at 650 Hz (Q 1.0): body just above the drivers' roll-off;
# - -7 dB at 4.8 kHz (Q 1.4): the measured +7..+9 dB driver peak
#   (Blue USB mic, 3 positions x L/R, spread <= 1.6 dB at 4-5 kHz);
# - -3 dB overall (20 Hz high-shelf) so the boost cannot clip at 100 %.
# Chosen by A/B listening over the stock-only filter (2026-11-26); the
# stock-only version is /usr/share/gemini/astro/astro-speaker-stock.conf.
# WirePlumber smart filter on the UCM Speaker sink only (earpiece and,
# later, headphones are not filtered). Drive stays at the stock -2 dB (UCM).
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Astro speaker filter (measured EQ)"
            media.name       = "Astro speaker filter"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpf_l label = bq_highpass
                      control = { "Freq" = 300.0 "Q" = 0.7071 } }
                    { type = builtin name = body_l label = bq_peaking
                      control = { "Freq" = 650.0 "Q" = 1.0 "Gain" = 3.0 } }
                    { type = builtin name = presence_l label = bq_peaking
                      control = { "Freq" = 4800.0 "Q" = 1.4 "Gain" = -7.0 } }
                    { type = builtin name = pregain_l label = bq_highshelf
                      control = { "Freq" = 20.0 "Q" = 0.7071 "Gain" = -3.0 } }
                    { type = builtin name = hpf_r label = bq_highpass
                      control = { "Freq" = 300.0 "Q" = 0.7071 } }
                    { type = builtin name = body_r label = bq_peaking
                      control = { "Freq" = 650.0 "Q" = 1.0 "Gain" = 3.0 } }
                    { type = builtin name = presence_r label = bq_peaking
                      control = { "Freq" = 4800.0 "Q" = 1.4 "Gain" = -7.0 } }
                    { type = builtin name = pregain_r label = bq_highshelf
                      control = { "Freq" = 20.0 "Q" = 0.7071 "Gain" = -3.0 } }
                ]
                links = [
                    { output = "hpf_l:Out" input = "body_l:In" }
                    { output = "body_l:Out" input = "presence_l:In" }
                    { output = "presence_l:Out" input = "pregain_l:In" }
                    { output = "hpf_r:Out" input = "body_r:In" }
                    { output = "body_r:Out" input = "presence_r:In" }
                    { output = "presence_r:Out" input = "pregain_r:In" }
                ]
                inputs  = [ "hpf_l:In" "hpf_r:In" ]
                outputs = [ "pregain_l:Out" "pregain_r:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.astro_speaker"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "astro-speaker-eq"
                filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "effect_output.astro_speaker"
                node.passive = true
            }
        }
    }
]
