# NOT LOADED: the stock-only alternative to filter-chain.conf.d/astro-speaker.conf.
# To use it: copy over /usr/share/pipewire/filter-chain.conf.d/astro-speaker.conf
# and run: systemctl --user restart filter-chain
# Astro Slide speaker: the stock Android speaker compensation filter
# (vendor /etc/audio_param/PlaybackACF_AudioParam.xml, "Speaker":
# bes_loudness_L_hpf_fc 0x12C = 300 Hz, order 2, all EQ bands 0), run by
# the stock HAL (mtk_bessound) on every playback stream to the speaker.
# Here: a 2nd-order Butterworth high-pass per channel as a WirePlumber
# smart filter on the UCM Speaker sink only (astro-linux618
# docs/audio-stock.md). The speaker drive stays at the stock -2 dB (UCM).
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Astro speaker filter (stock 300 Hz high-pass)"
            media.name       = "Astro speaker filter"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = hpf_l
                        label = bq_highpass
                        control = { "Freq" = 300.0 "Q" = 0.7071 }
                    }
                    {
                        type  = builtin
                        name  = hpf_r
                        label = bq_highpass
                        control = { "Freq" = 300.0 "Q" = 0.7071 }
                    }
                ]
                inputs  = [ "hpf_l:In" "hpf_r:In" ]
                outputs = [ "hpf_l:Out" "hpf_r:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.astro_speaker"
                media.class = Audio/Sink
                filter.smart = true
                filter.smart.name = "astro-speaker-stock"
                filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "effect_output.astro_speaker"
                node.passive = true
            }
        }
    }
]
