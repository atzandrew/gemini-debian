# SPDX-License-Identifier: BSD-3-Clause
# Astro Slide HiFi (astro-linux618 docs/audio-stock.md).
# Playback: AFE DL1 -> ADDA DL -> MT6359 DACs.
# Speaker: the HP buffer feeds the GPIO30 stereo amp (stock SPK_PATH_HP,
# int_hp_buf); "Speakers" powers the amp. Stock drive = speaker_pga 10 =
# -2 dB (PlaybackVolAna), which is also the clean maximum on this amp, so
# the drive is fixed there and the volume stays in software on top.
# Earpiece: MT6359 receiver driver from the left DAC (stock RCV_PATH_INT),
# stock receiver_pga 0 = +8 dB.
# Headphones and microphones come with jack detection / capture bring-up
# (A4 / A3); the HP outputs are driven whenever the speaker plays.

SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='DAC In Mux' Normal Path"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Headset Volume' 8,8"
		cset "name='HP Mux' Audio Playback"
		cset "name='Speakers Switch' on"
	]

	DisableSequence [
		cset "name='Speakers Switch' off"
		cset "name='HP Mux' Open"
	]

	ConflictingDevice [
		"Earpiece"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='Handset Volume' 18"
		cset "name='RCV Mux' Voice Playback"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RCV Mux' Open"
	]

	ConflictingDevice [
		"Speaker"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}
