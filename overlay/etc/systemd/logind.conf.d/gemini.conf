# Gemini PDA: suspend hangs this device (s2idle, no wake source), so logind
# must never try it. The silver side button sends KEY_SLEEP — reserved for
# the userspace light-sleep daemon (part 7), not systemd suspend.
# Holding Esc/On ~0.8 s sends KEY_POWER (mt6351-keys long press, 2026-10-05).
# logind must not act on it (at the greeter it would power off instantly);
# inside Plasma, powerdevil handles it and shows the Leave screen.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
