# Gemini PDA: system suspend works through the SPM (mt6797-suspend module,
# 2026-10-17): the silver side button (KEY_SLEEP) and closing the lid suspend;
# Esc/On, the silver button or opening the lid wake it. Not on external power
# (untested there; gemini-suspend-prep refuses it anyway). Inside Plasma,
# PowerDevil takes these over with its own settings.
# Holding Esc/On ~0.8 s sends KEY_POWER (mt6351-keys long press, 2026-10-05).
# logind must not act on it (at the greeter it would power off instantly);
# inside Plasma, powerdevil handles it and shows the Leave screen.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=suspend
HandleHibernateKey=ignore
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
