# Gemini PDA: system suspend works through the SPM (mt6797-suspend module,
# 2026-10-17). Inside Plasma, PowerDevil handles the lid and the silver side
# button (KEY_SLEEP) with its own settings (default: suspend; Esc/On, the
# silver button or opening the lid wake it).
# Outside Plasma (login screen) logind does nothing on the lid or the silver
# key: gemini-greeter-lid powers off when the lid stays shut there (2026-10-19,
# after a forgotten suspend drained the battery overnight).
# Holding Esc/On ~0.8 s sends KEY_POWER (mt6351-keys long press, 2026-10-05).
# logind must not act on it (at the greeter it would power off instantly);
# inside Plasma, powerdevil handles it and shows the Leave screen.
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
