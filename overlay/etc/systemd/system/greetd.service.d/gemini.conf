# Start the greeter only once the GPU driver is loaded, so X gets hardware
# rendering (glamor on panfrost via kmsro) instead of falling back.
# greetd runs on vt1 (config.toml): it must replace the text login there, or
# getty@tty1 keeps the screen and tuigreet never gets the keyboard.
[Unit]
After=gemini-panfrost-load.service getty@tty1.service
Wants=gemini-panfrost-load.service
Conflicts=getty@tty1.service
