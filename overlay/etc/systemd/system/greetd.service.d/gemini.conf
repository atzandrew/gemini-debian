[Unit]
# Plasma needs the GPU: start the login only after panfrost is loaded.
After=gemini-panfrost-load.service
Wants=gemini-panfrost-load.service
# greetd runs on tty1 (etc/greetd/config.toml); a getty there would fight it
# for the terminal (seen with greetd on 2026-10-02).
Conflicts=getty@tty1.service
After=getty@tty1.service
