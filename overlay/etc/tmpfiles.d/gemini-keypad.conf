# Keyboard matrix scan interval (matrix_keypad is built into the kernel; the
# poll_ms parameter is gemini-nixos' addition, default 20 ms). Each scan costs
# ~54 I2C interrupts: 20 ms ~3100 irq/s, 30 ms ~2200, 50 ms ~1650 (50 felt
# sluggish for fast typing; 30 chosen 2026-10-03).
w /sys/module/matrix_keypad/parameters/poll_ms - - - - 30
