# Gemini PDA: keep kernel info/debug messages off the console. The boot
# cmdline is compiled into the kernel (no "quiet"/"loglevel="), and the
# vendor Wi-Fi driver logs every power-state change (DRIVER OWN / FW OWN)
# and every scan, which floods tty1. Errors (level <3) still show; the rest
# stays in dmesg / journalctl -k. (NixOS did the same via
# boot.consoleLogLevel.)
kernel.printk = 3 4 1 3
