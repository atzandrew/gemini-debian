# Gemini PDA: drive the panel through the geminipda-drm KMS device (card0).
# card1 is the Mali GPU (panfrost, render-only); Mesa pairs the two (kmsro),
# so glamor renders on the GPU. Rotation to landscape happens in
# /usr/local/sbin/gemini-xinit (the panel's native mode is portrait 1080x2160).
Section "Device"
    Identifier "Gemini panel"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
EndSection
