# Gemini PDA built-in keyboard: the "gemini" xkb layout, US silkscreen variant
# (this unit: Shift+2 = @, Fn+K = ;). Fn = level 3 on RALT. Symbols copied
# from gemini-nixos config/xkb/symbols/gemini (default block = UK unit).
Section "InputClass"
    Identifier      "Gemini keyboard"
    MatchIsKeyboard "on"
    Option          "XkbModel"   "pc105"
    Option          "XkbLayout"  "gemini"
    Option          "XkbVariant" "us"
EndSection
