# Gemini PDA built-in keyboard: the "gemini" xkb layout (UK silkscreen; Fn =
# level 3 on RALT). Symbols copied from gemini-nixos config/xkb/symbols/gemini.
# For the US silkscreen use: Option "XkbVariant" "us"
Section "InputClass"
    Identifier      "Gemini keyboard"
    MatchIsKeyboard "on"
    Option          "XkbModel"  "pc105"
    Option          "XkbLayout" "gemini"
EndSection
