# Gemini PDA: SDDM login screen on Wayland (beta, 2026-10-08; replaces
# greetd/tuigreet). The greeter runs inside KWin, the same compositor as the
# Plasma session, so it gets the same rotation, 2x scale and touch mapping:
# KWin reads /var/lib/sddm/.config/kwinoutputconfig.json (a copy of the skel
# one) and the "gemini" keyboard layout from /etc/xdg/kxkbrc. No X server.
#
# --locale1 is left out on purpose: with it KWin would take the keymap from
# /etc/default/keyboard (plain "us") instead of kxkbrc.
# The two environment variables are the ones /etc/environment sets for the
# desktop (AFBC off for panfrost; KWin commit margin for geminipda-drm's
# copy) — the greeter does not read /etc/environment.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,PAN_MESA_DEBUG=noafbc

[Wayland]
CompositorCommand=env PAN_MESA_DEBUG=noafbc KWIN_DRM_OVERRIDE_SAFETY_MARGIN=12000 kwin_wayland --drm --no-lockscreen --no-global-shortcuts

[Theme]
Current=breeze
CursorTheme=breeze_cursors

[Users]
RememberLastUser=true
RememberLastSession=true
