# Never suspend the Gemini's ALSA output when idle.
#
# WHY (diagnosed 2026-10-03): when the stream closes, the MT6351 powers its
# headphone drivers down and the jack/speaker lines float, picking up board
# activity as an audible buzz/chatter (the "crackling" people report). While
# a stream is open the drivers hold the lines and it is silent — verified by
# playing /dev/zero. So keep the sink running (silence between sounds).
# Cost: the AFE DMA + codec stay on while PipeWire runs (some battery).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
