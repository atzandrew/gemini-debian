---
# Gemini first-boot setup: software set. Both sets are already in the image,
# so nothing is downloaded here. "legacy" only records the choice (as
# packagechooser_packagechooser = full | light); contextualprocess.conf acts
# on it with /usr/local/sbin/gemini-loadout.
mode: required
method: legacy
labels:
    step: "Software"

items:
    - id: full
      name: "Plasma"
      description: >-
        The usual KDE apps: Dolphin (files), Konsole (terminal), Gwenview
        (images), KWrite (text) and Haruna (video and music), plus Okular,
        Ark, KCalc and Firefox.
    - id: light
      name: "Plasma Light"
      description: >-
        Lighter apps that start faster and use less memory on the Gemini:
        PCManFM-Qt (files), Alacritty (terminal), imv (images), FeatherPad
        (text) and mpv (video and music), plus Okular, Ark, KCalc and
        Firefox. The KDE apps they replace are removed.
