---
# Gemini first-boot setup: apply the software set picked on the
# packagechooser page (packagechooser.conf). gemini-loadout never fails;
# what it did goes to the Calamares log and /etc/gemini/loadout.
# Removing the KDE apps takes a minute or two on the eMMC.
dontChroot: true
timeout: 600

packagechooser_packagechooser:
    full:
        - "/usr/local/sbin/gemini-loadout full"
    light:
        - "/usr/local/sbin/gemini-loadout light"
