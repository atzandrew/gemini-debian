---
# Gemini PDA (from Debian's calamares-settings-debian users.conf, 2026-10-09).
userGroup:       users
# Same groups as the build-time account (bin/customize.sh): sudo for admin,
# audio for `sudo gemini-audio` (sudoers rule), video/render for the GPU,
# input, netdev for NetworkManager, bluetooth, plugdev, dialout.
defaultGroups:
    - sudo
    - adm
    - audio
    - video
    - render
    - input
    - plugdev
    - netdev
    - dialout
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# Not "precious" about passwords: only non-empty is required. Weak passwords
# are allowed and the box for that is pre-ticked. No libpwquality checks —
# its dictionary (cracklib) isn't in the image ("error loading dictionary").
passwordRequirements:
    nonempty: true
allowWeakPasswords: true
allowWeakPasswordsDefault: true
