# Gemini PDA: greetd + tuigreet login (2026-10-16; replaces SDDM, which
# replaced greetd on 2026-10-08). tuigreet is a text greeter on tty1, so no
# compositor runs before login: less RAM and a faster boot than SDDM's KWin
# greeter. Plasma (Wayland) starts after login.
#
#   --asterisks          show a * per typed character (small keyboard)
#   --remember[-session] last user + session, in /var/cache/tuigreet
#                        (etc/tmpfiles.d/gemini-tuigreet.conf)
#   --sessions           Wayland sessions only; --xsessions points at a
#                        directory that doesn't exist, which hides the
#                        X11 sessions (no X server in the image)
#   --cmd                fallback when no session is remembered yet
#   --greeting/--theme   "Night" look (2026-10-19): no visible box (border =
#                        background), lavender labels, dim clock and keys.
#                        Colour NAMES only; their RGB values come from
#                        usr/share/gemini/vtrgb (gemini-console-palette).
#
# The first-boot image appends an [initial_session] block below (automatic
# login of the setup account -> Calamares). gemini-first-setup finish
# removes it again; see firstboot/greetd-initial-session.toml.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --asterisks --remember --remember-session --sessions /usr/share/wayland-sessions --xsessions /usr/share/gemini/no-x11-sessions --cmd startplasma-wayland --greeting 'g e m i n i' --theme 'container=black;border=black;title=darkgray;text=gray;greet=white;time=darkgray;prompt=magenta;input=white;action=darkgray;button=magenta'"
user = "_greetd"
