# mt6797-suspend options (gemini-nixos kernel/modules/mt6797-suspend).
# pcm_wdt=30: arm the SPM PCM watchdog on every sleep, as stock does
# (__spm_set_pcm_wdt): a stuck sleep resets the SoC ~30 s later instead of
# hanging until a power-button hold. Known random sleep hang, 2026-10-20/21.
# bias_check (default on): refuses to sleep while the LCD bias is on.
options mt6797_suspend pcm_wdt=30
