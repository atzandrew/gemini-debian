# Unattended-suspend cap (mt6797-suspend max_s): after this many seconds
# asleep the Gemini wakes and gemini-suspend-prep powers it off. Suspend
# draws ~208 mA (a full ~2.6 Ah cell lasts ~12 h), and the intermittent SPM
# hang (docs/spm-sleep.md in gemini-nixos) is more likely the longer it
# sleeps. 2026-10-18: a forgotten suspend drained the battery overnight.
# 0 = no cap.
options mt6797_suspend max_s=3600
