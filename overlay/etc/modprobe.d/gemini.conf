# Gemini PDA (ported from gemini-nixos services/gemini-pda.nix).
#
# panfrost must NOT autoload at boot: udev would probe the Mali before
# gemini-gpu-poweron has powered its MFG domains, the soft reset times out
# ("gpu soft reset timed out", -110) and the GPU stays dead for that boot.
# It is modprobed explicitly once the GPU is powered (part 4/5 units).
blacklist panfrost
