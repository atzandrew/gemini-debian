# geminipda-drm: skip the CPU cache clean/invalidate around the scanout copy
# (7.9 -> 3.3 ms per full frame; chosen 2026-10-03). Risk is purely visual:
# a rare stale 16x1 px sliver until that spot redraws. Set to 1 if slivers
# show up near text/cursor (live: /sys/module/geminipda_drm/parameters/cache_sync).
options geminipda-drm cache_sync=0
# panel-pm (2026-10-21, gemini-nixos docs/display.md "Panel off/on"): power the
# panel down in every system suspend with the stock vendor sequence (LCD bias
# off while asleep) and re-initialise it on resume. Without it the panel sits
# biased and unrefreshed in sleep (screen burns). gemini-suspend-prep refuses
# to suspend when this is off. Live: /sys/module/geminipda_drm/parameters/panel*
options geminipda-drm panel_suspend=1
