# Cosmo: default volume for audio inputs (headset mic). The MT6358 preamp
# runs at its 24 dB maximum and the mic is still ~10 dB quiet for speech,
# so new inputs start at 150 % (3.375 linear, +10.6 dB software gain).
# Measured 2026-11-24 (Apple headset, normal voice): speech -37 dBFS RMS,
# peaks -22 dBFS, no clipping.
wireplumber.settings = {
  device.routes.default-source-volume = 3.375
}
