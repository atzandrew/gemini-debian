# Cosmo Communicator HiFi.
# Playback: AFE DL1 -> MT6358 ADDA -> HPL/HPR. The two AW8738 speaker amps are
# fed from the HP outputs (stock SPK_PATH_HP), so the HP buffer gain is the
# speaker drive: stock runs it at -2 dB (Headset_PGA_GAIN, Gemian capture
# 2026-10-31) = 'Headphone Volume' 8 here. Volume stays in software on top of
# that fixed drive, as stock does. The headphone jack shares the same outputs:
# the MT6358 ACCDET reports "Headphone Jack", and with headphones plugged in
# the speaker amps are off (stock accdet.c keeps the amps on only while no
# headset is plugged in).
# Capture: AFE UL1 <- MT6358 ADDA UL. Headset mic = AIN1 (MICBIAS1 2.6 V,
# ACC mode, stock mic-mode 1), fed to both ADC channels (mono mic).

SectionVerb {
	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Headphone Volume' 8,8"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	ConflictingDevice [
		"Headphones"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Volume' 8,8"
	]

	ConflictingDevice [
		"Speaker"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Mic Type Mux' ACC"
		cset "name='PGA L Mux' AIN1"
		cset "name='PGA R Mux' AIN1"
		cset "name='ADC L Mux' Left Preamplifier"
		cset "name='ADC R Mux' Right Preamplifier"
		cset "name='PGA Volume' 4,4"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]

	DisableSequence [
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
		cset "name='ADC L Mux' Idle"
		cset "name='ADC R Mux' Idle"
		cset "name='PGA L Mux' None"
		cset "name='PGA R Mux' None"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		JackControl "Headset Mic Jack"
	}
}
