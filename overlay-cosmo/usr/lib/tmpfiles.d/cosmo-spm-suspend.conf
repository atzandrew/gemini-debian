# Cosmo: system suspend through the stock SPM path (kernel cosmo-spm-suspend).
# Without enable, suspend falls through to PSCI SYSTEM_SUSPEND, which the
# vendor ATF never wakes from. The Esc/power key (PMIC, EINT 182) wakes it.
# wake_s: SPM safety timer, the board wakes itself after 1 h if no key does.
# keep_wdt 0: the TOPRGU watchdog (a test escape) would reset sleeps over ~20 s.
w /sys/module/cosmo_spm_suspend/parameters/wake_s - - - - 3600
w /sys/module/cosmo_spm_suspend/parameters/keep_wdt - - - - 0
w /sys/module/cosmo_spm_suspend/parameters/enable - - - - 1
