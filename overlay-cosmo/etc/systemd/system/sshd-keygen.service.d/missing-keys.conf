# Debian runs this only when systemd sees a first boot, which a flashed
# Cosmo image never is (its machine-id is set up by Calamares, not systemd),
# so the build-time keys would stay. The image ships without host keys;
# generate them whenever they are missing. An empty Condition line clears
# the packaged conditions; the two kept ones are re-added.
[Unit]
ConditionFirstBoot=
ConditionPathIsReadWrite=/etc/ssh
ConditionPathIsSymbolicLink=!/etc/ssh
ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key
