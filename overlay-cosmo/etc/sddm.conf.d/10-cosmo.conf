# Cosmo Communicator: SDDM on Wayland, with KWin as the login screen's
# compositor (as KDE recommends for Plasma 6). KWin reads the panel
# rotation and scale from /var/lib/sddm/.config/kwinoutputconfig.json
# (bin/customize.sh copies the desktop default there) and the keyboard
# layout from /etc/default/keyboard (--locale1).
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell
InputMethod=

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=breeze
