# An oops becomes a panic, so the board resets instead of running on broken
# (panic=10 on the kernel command line; if the vendor PSCI reboot does not
# act, the hardware watchdog, no longer fed, resets the board).
# The boot command line asks for the same with oops=panic; this file also
# covers older boot images. (No softlockup_panic: this kernel has no
# soft-lockup detector.)
kernel.panic_on_oops = 1
