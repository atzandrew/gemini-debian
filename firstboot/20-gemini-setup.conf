# Gemini first-boot setup (installed into fresh images only, by
# bin/customize.sh when GEMINI_FIRST_SETUP=1). Logs the build-time account
# straight into Plasma, where Calamares starts by itself. Calamares'
# last step (gemini-first-setup finish) deletes this file.
[Autologin]
User=@GEMINI_USER@
Session=plasma.desktop
Relogin=false
