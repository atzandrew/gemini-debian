# gemini-first-setup (fresh image only): bin/customize.sh installs this as
# /etc/sddm.conf.d/zz-gemini-first-setup.conf on SDDM images (the Cosmo);
# gemini-first-setup finish deletes it. SDDM logs the setup account in once,
# without a password, and the gemini-first-setup autostart opens Calamares.
[Autologin]
User=@GEMINI_USER@
Session=plasma
